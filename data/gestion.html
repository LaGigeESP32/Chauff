 #connectionStatus {
        position: fixed;

    }

input[type="checkbox"]:disabled + .slider {
	opacity: 0.3;
    background-color: #ccc; /* Couleur de fond différente */
    cursor: not-allowed; /* Curseur différent */
}

input[type="time"]:disabled {
	opacity: 0.3;

}

.switch {position: relative; display: inline-block; width: 40px; height: 20px;}
.switch input {opacity: 0; width: 0; height: 0;}
.slider {position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s;}
.slider:before {position: absolute; content: ''; height: 18px; width: 18px; left: 2px; bottom: 1px; background-color: white; transition: .4s;}
input:checked + .slider {background-color: #2196F3;}
input:checked + .slider:before {transform: translateX(20px);}
.slider.round {border-radius: 18px;}
.slider.round:before { border-radius: 50%;}

    <script>
	
	//var gateway = `ws://${window.location.hostname}/ws`; 

	var websocket; window.addEventListener('load', onLoad);

	var outConnect = false;

	let timeout;

function buildWsUrl() {
  const wsProto = (window.location.protocol === "https:") ? "wss" : "ws";

  // Si on est derrière nginx, on a un préfixe /espXYZ/ dans l'URL
  // Exemple: /esp211/  ou /esp211/page.html
  const m = window.location.pathname.match(/^\/(esp\d{3})(\/|$)/);
  const prefix = m ? `/${m[1]}` : "";

  const url = `${wsProto}://${window.location.host}${prefix}/ws`;
  console.log("WS URL =", url, " | pathname =", window.location.pathname);
  return url;
}

	function onLoad(event) {
	initWebSocket();
	updateslider();
	}

	function initWebSocket() {
		const gateway = buildWsUrl();
	websocket = new WebSocket(gateway); 
	websocket.onopen = onOpen; 
	websocket.onclose = onClose; 
	websocket.onmessage = onMessage;
	resetTimeout();
	}

	function onOpen(event) {
	console.log('Connection opened');
	outConnect = true;
	document.getElementById('connectionStatus').style.display = 'none';
	// Annonce au serveur la page actuelle
	websocket.send(JSON.stringify({pageWebEnCours: "Gestion"}));
	}

	function onClose(event) {
	console.log('Connection closed');
	outConnect = false;
    document.getElementById('connectionStatus').style.display = 'block';
	document.getElementById('connectionStatus').style.backgroundColor = '#f44336';
	}
		
	function resetTimeout() {
		clearTimeout(timeout);
		// Définissez un nouveau timeout pour surveiller les mises à jour
		timeout = setTimeout(() => {
			document.getElementById('connectionStatus').style.display = 'block';
			document.getElementById('connectionStatus').style.backgroundColor = '#f44336';
			initWebSocket(); // Tente une reconnexion après expiration du timeout
			console.log("timeout");
		}, 10000); // 5 secondes pour dépasser l'intervalle de 5 secondes
	}
		
function onMessage(event) {

	var receivedData = JSON.parse(event.data);
	
	//{"enChauffe": "0","dateheure": "Mercredi 04 Mars 2026 - 12:12","powerLevel": "0.00","tEauHaut": "-100.00","lastTempLegio": "62","routeurIsConnected": "1","HC": 0"}
	
	resetTimeout();
    const connectionStatus = document.getElementById('connectionStatus');
    connectionStatus.style.display = 'none';
    connectionStatus.style.backgroundColor = '#4CAF50';
	
	// Vérifiez si les données sont spécifiquement "Nan:Nan"
	if (Object.keys(receivedData).length === 1 && receivedData.Nan === 0) {
    // Ignorer le reste du code
    return;
    }
	
	document.getElementById('modeSaison').checked = receivedData.modeSaison;
	
	document.getElementById('modeSaisonAuto').checked = receivedData.modeSaisonAuto;
	
	document.getElementById('startHCTime').value = receivedData.startHCTime;
	document.getElementById('endHCTime').value = receivedData.endHCTime;
	
	document.getElementById('ActiveRouteur').checked = receivedData.ActiveRouteur;
	
	document.getElementById('tempConsigneRouteurHiver').value = receivedData.tempConsigneRouteurHiver;
	document.getElementById('ConsigneRouteurHiverP4').value = receivedData.ConsigneRouteurHiverP4 - receivedData.tempConsigneRouteurHiver;
	document.getElementById('ConsigneRouteurHiverP3').value = receivedData.ConsigneRouteurHiverP3 - receivedData.ConsigneRouteurHiverP4;
	document.getElementById('ConsigneRouteurHiverP2').value = receivedData.ConsigneRouteurHiverP2 -receivedData.ConsigneRouteurHiverP3;

	
	document.getElementById('ActiveHC').checked = receivedData.ActiveHC;
	document.getElementById('tempConsigneHCHiver').value = receivedData.tempConsigneHCHiver;
	
	
	document.getElementById('Activemaintien').checked = receivedData.Activemaintien;	
	document.getElementById('Tmaintien').value = receivedData.Tmaintien;
	document.getElementById('Pmaintien').value = receivedData.Pmaintien;

	document.getElementById('maxPower').value = receivedData.maxPower;
	
	document.getElementById('SoftVersion').innerText = receivedData.SoftVersion;

	
	updateslider();
	
	}

		var jsonData = JSON.stringify(data);
		websocket.send(jsonData);
		//console.log(jsonData);
		
		}

				var checkbox = document.getElementById('modeSaison');

			function updateBackground(slider) {
            var value = slider.value;
			var max = slider.max;
			var min = slider.min;
			var nb = max-min;
   			
			var cursorWidth = 18; // Largeur du curseur
			var adjustment = (cursorWidth / 2) / slider.offsetWidth * 100; // Ajustement en pourcentage
			
			//var percentage = ((value - min) / nb) * 100;
			//slider.style.background = `linear-gradient(to right, #2196F3 ${percentage}%, #ccc ${percentage}%)`;
			
			var cursorWidth = 18; // Largeur du curseur en pixels
			var adjustment = (cursorWidth / slider.offsetWidth) * nb; // Ajustement en valeur de slider

			var percentage = ((value - min + adjustment / 2) / (nb + adjustment)) * 100;

			slider.style.background = `linear-gradient(to right, #2196F3 0%, #2196F3 ${percentage}%, #ccc ${percentage}%, #ccc 100%)`;
